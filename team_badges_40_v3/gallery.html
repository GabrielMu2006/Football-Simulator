const params=new URLSearchParams(location.search), sheet=Number(params.get('sheet')||0);
const choices={};let expanded=false;
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
if(params.has('overview')){document.body.classList.add('overview');document.getElementById('heading').textContent='四十支球队 · 队标全览';document.getElementById('intro').textContent='现代纹章 × 克制奇幻 / 独立透明队标 / 2026.10';document.getElementById('range').textContent='ALL 40 CLUB IDENTITIES';}
if(sheet){document.body.classList.add('sheet');document.getElementById('heading').textContent='队标一览 · '+String((sheet-1)*10+1).padStart(2,'0')+'—'+String(sheet*10).padStart(2,'0');document.getElementById('intro').textContent='独立透明队标 / 下方显示32px与48px实际尺寸';document.getElementById('range').textContent='SHEET '+sheet+' / 04';}
function updateExport(){const n=Object.keys(choices).length;const b=document.getElementById('export');b.disabled=!n;b.textContent='导出选择（'+n+'/40）';}
function render(){
 const query=document.getElementById('search').value.trim().toLowerCase();
 const filtered=clubs.filter(c=>(!sheet||Math.ceil(c.number/10)===sheet)&&(!query||(c.club_zh+' '+c.club_en+' '+String(c.number).padStart(2,'0')).toLowerCase().includes(query)));
 document.getElementById('count').textContent=String(filtered.length).padStart(2,'0');
 const grid=document.getElementById('grid');grid.innerHTML='';
 for(const c of filtered){
  const file='PNG/'+encodeURIComponent(c.filename), id=String(c.number).padStart(2,'0'), article=document.createElement('article');article.className='club';
  article.innerHTML='<a class="crest" href="'+file+'" target="_blank" rel="noopener" aria-label="查看'+esc(c.club_zh)+'队标原图"><span class="number">'+id+'</span><img src="'+file+'" alt="'+esc(c.club_zh)+'新版队标"></a><h2>'+esc(c.club_zh)+'</h2><div class="en">'+esc(c.club_en)+'</div><div class="samples"><div class="sample"><img class="s32" src="'+file+'" alt=""><span>32px</span></div><div class="sample"><img class="s48" src="'+file+'" alt=""><span>48px</span></div></div><details'+(expanded?' open':'')+'><summary>主场命名 · 3个候选</summary><p class="theme">'+esc(c.theme)+'</p></details>';
  const details=article.querySelector('details');
  for(const v of c.candidates){
   const label=document.createElement('label');label.className='candidate';
   label.innerHTML='<input type="radio" name="venue-'+id+'" value="'+v.choice+'"'+(choices[c.number]===v.choice?' checked':'')+'><span class="choice">'+v.choice+'</span><span><strong>'+esc(v.name_zh)+(v.choice==='A'?' <span class="prior">现方案</span>':'')+'</strong><small>'+esc(v.name_en)+'</small></span>';
   label.querySelector('input').addEventListener('change',()=>{choices[c.number]=v.choice;updateExport();});details.appendChild(label);
  }
  grid.appendChild(article);
 }
 document.getElementById('empty').hidden=!!filtered.length;
}
document.getElementById('search').addEventListener('input',render);
document.getElementById('theme').addEventListener('click',()=>{const dark=document.body.classList.toggle('dark');document.getElementById('theme').textContent=dark?'切换浅色背景':'切换深色背景';});
document.getElementById('expand').addEventListener('click',()=>{expanded=!expanded;document.querySelectorAll('details').forEach(d=>d.open=expanded);document.getElementById('expand').textContent=expanded?'收起球场候选':'展开球场候选';});
document.getElementById('clear').addEventListener('click',()=>{for(const key of Object.keys(choices))delete choices[key];updateExport();render();});
document.getElementById('export').addEventListener('click',()=>{
 const selected=clubs.filter(c=>choices[c.number]).map(c=>({number:c.number,club_zh:c.club_zh,club_en:c.club_en,...c.candidates.find(v=>v.choice===choices[c.number])}));
 const blob=new Blob([JSON.stringify({status:'user_review_selection',selections:selected},null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='stadium-name-selections.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);
});
render();
</script></body></html>
